global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: jmx
    static_configs:
      - targets: ["jmx-exporter-1:7071"]
        labels:
          broker: kafka1
      - targets: ["jmx-exporter-2:7071"]
        labels:
          broker: kafka2
      - targets: ["jmx-exporter-3:7071"]
        labels:
          broker: kafka3

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: producer
    static_configs:
      - targets: ["producer:8081"]

  - job_name: consumer
    static_configs:
      - targets: ["consumer-1:8082", "consumer-2:8082", "consumer-3:8082"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
